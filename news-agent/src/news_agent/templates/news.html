<!doctype html>
<html lang="en" data-theme="light">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="description" content="New SURE evaluation capabilities, scoring pipelines and source commits.">
<title>Feature updates · SURE Evaluation</title>
<style>
:root{color-scheme:light;--bg:#f8faf8;--paper:#fff;--ink:#192c25;--muted:#52675e;--line:#dbe3de;--accent:#245d48;--wash:#eef6f1}
[data-theme=dark]{color-scheme:dark;--bg:#13201c;--paper:#1b2a24;--ink:#e4eee8;--muted:#bacac1;--line:#3c5247;--accent:#a6d9ba;--wash:#283830}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.5 Inter,Arial,sans-serif}
a{color:var(--accent);text-underline-offset:3px}button,input{font:inherit;color:inherit}button,summary{cursor:pointer}
:focus-visible{outline:3px solid #58a182;outline-offset:3px}[hidden]{display:none!important}main,nav{max-width:980px;margin:auto;padding:0 24px}
nav{display:flex;align-items:center;gap:18px;height:66px;border-bottom:1px solid var(--line)}nav strong{margin-right:auto}nav a{font-size:13px}
button,input{background:var(--paper);border:1px solid var(--line);border-radius:6px;padding:6px 11px}.theme-toggle{width:36px;height:36px;padding:0}
h1{font-size:32px;line-height:1.2;margin:32px 0 20px}.toolbar,.filters{display:flex;align-items:center;flex-wrap:wrap;gap:6px}
.toolbar{justify-content:space-between;gap:12px;margin-bottom:18px}.filter{font-size:12px;padding:6px 10px}.filter.active{background:var(--accent);color:var(--paper)}
input[type=search]{width:210px;font-size:13px}.release{background:var(--paper);border:1px solid var(--line);border-radius:8px;padding:18px 24px;margin:0 0 12px;position:relative}
.release header,.sources{display:flex;align-items:baseline;gap:12px;flex-wrap:wrap}.release header{justify-content:space-between;font-size:12px;color:var(--muted)}
.release header span{font-weight:700;color:var(--accent)}h2{font-size:21px;line-height:1.3;margin:8px 0 4px}p{margin:4px 0;color:var(--muted)}
.flow{white-space:pre-line;font-size:14px;color:var(--ink);border-left:3px solid var(--line);padding-left:10px;margin:12px 0}
details{border-top:1px solid var(--line);padding-top:10px}summary{font-weight:600;color:var(--accent);font-size:13px;width:fit-content}
details p{margin:10px 0;font-size:13px}ul{list-style:none;padding:0;margin:12px 0}li{display:flex;align-items:center;justify-content:space-between;gap:12px;border-top:1px solid var(--line);padding:8px 0}
li>div{min-width:0}code,small{overflow-wrap:anywhere}code{font-size:12px}small{display:block;color:var(--muted);font-size:12px}
.copy-button,.commit{font-size:12px}.commit{display:block;width:fit-content;margin:-20px 0 0 auto;position:relative}
details[open]+.commit{margin-top:12px}.toast{position:fixed;bottom:22px;left:50%;transform:translateX(-50%);padding:9px 16px;background:var(--ink);color:var(--paper);border-radius:6px}
.skip{position:absolute;left:-999px}.skip:focus{left:10px;background:var(--paper);z-index:2}main{padding-bottom:36px}
@media(max-width:600px){main,nav{padding-left:16px;padding-right:16px}.toolbar{align-items:stretch;flex-direction:column}input[type=search]{width:100%}.release{padding:15px}h1{font-size:26px;margin-top:22px}}
</style>
</head>
<body>
<a class="skip" href="#updates">Skip to updates</a>
<nav><strong>SURE Evaluation</strong><a href="https://github.com/bichengzhang09-crypto/sure-evaluation">Repository ↗</a>
<button type="button" class="theme-toggle" aria-label="Switch theme" title="Switch theme">◐</button></nav>
<main><h1>Feature updates</h1>
<div class="toolbar"><div class="filters" role="group" aria-label="Filter by task"><button class="filter active" type="button" data-task="all">All updates · {{COUNT}}</button>{{FILTERS}}</div>
<input type="search" placeholder="Search updates…" aria-label="Search updates"></div>
<div id="updates">{{CONTENT}}</div><p class="empty" hidden>No matching updates.</p></main>
<div class="toast" role="status" aria-live="polite" hidden></div>
<script>
(()=>{
const root=document.documentElement,theme=document.querySelector('.theme-toggle');
function setTheme(value){root.dataset.theme=value;theme.setAttribute('aria-pressed',String(value==='dark'));theme.setAttribute('aria-label',value==='dark'?'Switch to light theme':'Switch to dark theme')}
try{setTheme(localStorage.getItem('sure-news-theme')||'light')}catch(_){setTheme('light')}
theme.addEventListener('click',()=>{const value=root.dataset.theme==='light'?'dark':'light';setTheme(value);try{localStorage.setItem('sure-news-theme',value)}catch(_){}});
let task='all';const search=document.querySelector('input[type=search]'),buttons=[...document.querySelectorAll('.filter')],releases=[...document.querySelectorAll('.release')];
function filter(){const query=search.value.trim().toLowerCase();let count=0;for(const item of releases){const visible=(task==='all'||item.dataset.tasks.split(' ').includes(task))&&item.dataset.search.toLowerCase().includes(query);item.hidden=!visible;if(visible)count++}document.querySelector('.empty').hidden=count>0}
for(const button of buttons){button.setAttribute('aria-pressed',String(button.classList.contains('active')));button.addEventListener('click',()=>{task=button.dataset.task;for(const other of buttons){other.classList.toggle('active',other===button);other.setAttribute('aria-pressed',String(other===button))}filter()})}search.addEventListener('input',filter);
let toastTimer;function notify(message){const toast=document.querySelector('.toast');toast.textContent=message;toast.hidden=false;clearTimeout(toastTimer);toastTimer=setTimeout(()=>{toast.hidden=true},2200)}
for(const button of document.querySelectorAll('[data-copy]'))button.addEventListener('click',async()=>{const value=button.dataset.copy;try{if(navigator.clipboard&&window.isSecureContext)await navigator.clipboard.writeText(value);else{const field=document.createElement('textarea');field.value=value;field.style.position='fixed';field.style.opacity='0';document.body.append(field);field.select();const success=document.execCommand('copy');field.remove();if(!success)throw Error('copy unavailable')}notify('Pipeline ID copied');button.textContent='✓ Copied';setTimeout(()=>{button.innerHTML='<svg width="12" height="12" viewBox="0 0 16 16" fill="none" aria-hidden="true"><rect x="5" y="5" width="9" height="9" rx="1.5" stroke="currentColor"/><path d="M10 3V2H2v8h1" stroke="currentColor"/></svg> Copy'},1800)}catch(_){notify('Select the pipeline ID to copy it manually')}});
function revealRoute(){const target=document.getElementById(location.hash.slice(1));const details=target?.closest('details');if(details){details.open=true;target.scrollIntoView()}}
window.addEventListener('hashchange',revealRoute);revealRoute();
})();
</script>
</body>
</html>
